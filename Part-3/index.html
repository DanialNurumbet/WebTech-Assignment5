<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Part 1</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <navbar>
            <a href="/index.html">Part 1</a>
            <a href="/Part-2/index2.html">Part 2</a>
            <a href="/Part-3/index.html">Part 3</a>
            <a href="/Part-4/index.html">Part 4</a>
        </navbar>
    </header>

    <main>
        <div class="task-blocks">
            <div class="task">
                <h2>Task 5 | Mouse Events</h2>
                <div id="task-5-box">
                    <p>MOUSE OVER ME</p>
                </div>
            </div>
            
            <div class="task">
                <h2>Task 6 | Keyboard Events</h2>
                <input id="key" type="text" placeholder="Press some keys">
                <p id="result">You pressed: Nothing by now</p>
            </div>

            <div class="task">
                <h2>Task 7 | Calculator</h2>
                <input id="first-number" type="number" placeholder="First Number">
                <input id="second-number" type="number" placeholder="Second Number">
                <div class="operators">
                    <button id="addition">+</button>
                    <button id="subtraction">-</button>
                    <button id="multiplication">*</button>
                    <button id="division">/</button>
                </div>
                <p id="calc-result">Result: Nothing</p>
            </div>
        </div>
    </main>
    <script src="script.js" charset="UTF-8"></script>
</body>
